="78" width="1060" height="50" rx="10" fill="#001525" stroke="#001525" stroke-width="1.5"/><text x="530" y="109" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" font-family="'IBM Plex Mono',monospace">embed( input_column, model )</text><line x1="330" y1="128" x2="330" y2="142" stroke="#94A3B8" stroke-width="1.5"/><text x="330" y="158" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" >input_column · chunk_text or ticket body</text><line x1="560" y1="128" x2="560" y2="142" stroke="#94A3B8" stroke-width="1.5"/><text x="560" y="158" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" >model · var embedding_model, one per KB</text><line x1="790" y1="128" x2="790" y2="142" stroke="#94A3B8" stroke-width="1.5"/><text x="790" y="158" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" >chunk_id · the incremental cache key</text><rect x="0" y="178" width="250" height="62" rx="10" fill="#EFF4FE" stroke="#E6E9EF" stroke-width="1.5"/><text x="14" y="197" font-size="10" font-weight="800" fill="#94A3B8"  letter-spacing="0.8">SNOWFLAKE</text><text x="14" y="216" font-size="12.5" font-weight="800" fill="#306BEA" font-family="'IBM Plex Mono',monospace">AI_EMBED</text><text x="14" y="233" font-size="9.5" font-weight="500" fill="#475569" font-family="'IBM Plex Mono',monospace">snowflake-arctic-embed-m-v1.5</text><rect x="268" y="178" width="250" height="62" rx="10" fill="#fff" stroke="#E6E9EF" stroke-width="1.5"/><text x="282" y="197" font-size="10" font-weight="800" fill="#94A3B8"  letter-spacing="0.8">BIGQUERY</text><text x="282" y="216" font-size="12.5" font-weight="800" fill="#306BEA" font-family="'IBM Plex Mono',monospace">AI.EMBED</text><text x="282" y="233" font-size="9.5" font-weight="500" fill="#475569" font-family="'IBM Plex Mono',monospace">text-embedding-005, Vertex AI</text><rect x="536" y="178" width="250" height="62" rx="10" fill="#fff" stroke="#E6E9EF" stroke-width="1.5"/><text x="550" y="197"