<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 278" preserveAspectRatio="xMidYMid meet"><defs><marker id="pr-a" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker></defs><rect x="125" y="6" width="250" height="46" rx="10" fill="#fff" stroke="#E6E9EF" stroke-width="1.5"/><text x="141" y="26" font-size="13.5" font-weight="800" fill="#001525" font-family="'IBM Plex Mono',monospace">5x *_embed</text><text x="141" y="44" font-size="10" font-weight="500" fill="#475569" >legal_docs / incident_reports / crm_notes / call_transcripts / support_tickets</text><path d="M250 52 L350 74" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#pr-a)"/><rect x="405" y="6" width="250" height="46" rx="10" fill="#fff" stroke="#E6E9EF" stroke-width="1.5"/><text x="421" y="26" font-size="13.5" font-weight="800" fill="#001525" font-family="'IBM Plex Mono',monospace">search</text><text x="421" y="44" font-size="11" font-weight="500" fill="#475569" >embed the query, once per demo</text><path d="M530 52 L530 74" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#pr-a)"/><rect x="685" y="6" width="250" height="46" rx="10" fill="#fff" stroke="#E6E9EF" stroke-width="1.5"/><text x="701" y="26" font-size="13.5" font-weight="800" fill="#001525" font-family="'IBM Plex Mono',monospace">embedding_canary</text><text x="701" y="44" font-size="11" font-weight="500" fill="#475569" >the package's own drift monitor</text><path d="M810 52 L710 74" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#pr-a)"/><rect x="0" y="78" width="1060" height="50" rx="10" fill="#001525" stroke="#001525" stroke-width="1.5"/><text x="530" y="109" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" font-family="'IBM Plex Mono',monospace">embed( input_column, model )</text><line x1="350" y1="128" x2="350" y2="142" stroke="#94A3B8" stroke-width="1.5"/><text x="350" y="158" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" >input_column · chunk_text, every source alike</text><line x1="530" y1="128" x2="530" y2="142" stroke="#94A3B8" stroke-width="1.5"/><text x="530" y="158" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" >model · var embedding_model, one per KB</text><line x1="710" y1="128" x2="710" y2="142" stroke="#94A3B8" stroke-width="1.5"/><text x="710" y="158" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle" >chunk_id · the incremental cache key</text><rect x="0" y="178" width="250" height="62" rx="10" fill="#EFF4FE" stroke="#E6E9EF" stroke-width="1.5"/><text x="14" y="197" font-size="10" font-weight="800" fill="#94A3B8"  letter-spacing="0.8">SNOWFLAKE</text><text x="14" y="216" font-size="12.5" font-weight="800" fill="#306BEA" font-family="'IBM Plex Mono',monospace">AI_EMBED</text><text x="14" y="233" font-size="9.5" font-weight="500" fill="#475569" font-family="'IBM Plex Mono',monospace">snowflake-arctic-embed-m-v1.5</text><rect x="268" y="178" width="250" height="62" rx="10" fill="#fff" stroke="#E6E9EF" stroke-width="1.5"/><text x="282" y="197" font-size="10" font-weight="800" fill="#94A3B8"  letter-spacing="0.8">BIGQUERY</text><text x="282" y="216" font-size="12.5" font-weight="800" fill="#306BEA" font-family="'IBM Plex Mono',monospace">AI.EMBED</text><text x="282" y="233" font-size="9.5" font-weight="500" fill="#475569" font-family="'IBM Plex Mono',monospace">text-embedding-005, Vertex AI</text><rect x="536" y="178" width="250" height="62" rx="10" fill="#fff" stroke="#E6E9EF" stroke-width="1.5"/><text x="550" y="197" font-size="10" font-weight="800" fill="#94A3B8"  letter-spacing="0.8">DATABRICKS</text><text x="550" y="216" font-size="12.5" font-weight="800" fill="#306BEA" font-family="'IBM Plex Mono',monospace">ai_query</text><text x="550" y="233" font-size="9.5" font-weight="500" fill="#475569" font-family="'IBM Plex Mono',monospace">databricks-gte-large-en, serverless</text><rect x="804" y="178" width="250" height="62" rx="10" fill="#fff" stroke="#E6E9EF" stroke-width="1.5"/><text x="818" y="197" font-size="10" font-weight="800" fill="#94A3B8"  letter-spacing="0.8">DUCKDB</text><text x="818" y="216" font-size="12.5" font-weight="800" fill="#94A3B8" font-family="'IBM Plex Mono',monospace">not implemented</text><text x="818" y="233" font-size="9.5" font-weight="500" fill="#475569" font-family="'IBM Plex Mono',monospace">stand-in vector, keeps parsing green</text><text x="0" y="268" font-size="12.5" font-weight="500" fill="#94A3B8" >Seven embed()-calling jobs (five per-source *_embed models, search, and embedding_canary) dispatch to the same macro. Every real call is gated behind ai_functions_enabled and logged to ai_run_log.</text></svg>
