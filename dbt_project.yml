name: 'jaffle_logistics'
version: '1.0.0'
config-version: 2

profile: 'jaffle-logistics'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  jaffle_logistics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  jaffle_logistics:
    +quote_columns: false
