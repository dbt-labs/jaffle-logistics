name: 'jaffle_logistics'
version: '1.0.0'
config-version: 2

profile: 'jaffle-logistics'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# dbt_context_engineering no longer self-creates ai_run_log (its own bootstrap raced
# under concurrent threads). Runs once, serially, before any model, so there's nothing
# else to race against yet. depends_on is required: ref() inside the macro's
# conditional isn't statically inferable by dbt's parser without it.
on-run-start:
  - "-- depends_on: {{ ref('ai_run_log') }}\n{{ dbt_context_engineering.create_ai_run_log_table() }}"

models:
  jaffle_logistics:
    staging:
      +materialized: view
      +docs:
        node_color: "#D2955C"
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    context:
      # Up-to-meta phase (chunk/reshape through the *_meta models): blue.
      # Overridden to cyan below for the ai/ subfolder (up-to-knowledge-base),
      # and per-model for the five *_hashed models, which sit between the two.
      +docs:
        node_color: "#7C93B0"
      ai:
        # Real cloud AI-function-cost layer (embed()/classify() calls): five
        # independent per-source chains (legal_docs/incident_reports/crm_notes/
        # call_transcripts/support_tickets)_{classify,embed,embedded_classified},
        # plus knowledge_base and search. Their upstream *_hashed helpers stay
        # outside this gate (models/context/) since they only compute a hash
        # column, no AI call.
        # Disabled by default so a plain `dbt build` can never accidentally
        # trigger AI-function spend.
        # This is an actual selection-time gate (dbt won't build a disabled model
        # even under an explicit --select), not just a documentation convention.
        # Opt in per invocation: --vars '{ai_functions_enabled: true}'.
        # Keyed directly on ai_functions_enabled, dbt_context_engineering's own
        # dispatch-layer var (ADR-0030, enforced inside every generate/classify/
        # extract/embed/ai_agg call via require_ai_functions_enabled): a
        # selected model with this false would fail with that macro's raised
        # compiler error rather than being skipped, so the skip and the raise
        # agree on the same flag.
        +enabled: "{{ var('ai_functions_enabled', false) }}"
        # Up-to-knowledge-base phase: cyan. knowledge_base itself overrides to
        # purple, search overrides to unset, both in models/context/ai/_context_ai.yml.
        +docs:
          node_color: "#7FAFAF"

  # Same gate, same var, applied to the package's own runtime drift monitor
  # (embedding_canary), which also makes real embed() calls and is disabled by
  # the package's own default for the same reason. Unified under one flag so
  # turning on real AI-function spend is a single decision, not two separate
  # ones to remember.
  dbt_context_engineering:
    monitoring:
      +enabled: "{{ var('ai_functions_enabled', false) }}"

seeds:
  jaffle_logistics:
    +quote_columns: false
    # Source phase (the project's raw origin data): green.
    +docs:
      node_color: "#7FA37F"
    contracts:
      # BigQuery's schema autodetection infers this column as INT64 from the sample
      # values, then rejects the literal "97.0" text in the CSV. Force it explicitly
      # (portable: harmless on Snowflake/DuckDB/Databricks, which infer it correctly).
      +column_types:
        sla_ontime_pct: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"

  # Mirrors the models: dbt_context_engineering: monitoring: +enabled override above. The
  # package ships this seed disabled by default, paired with its own monitoring +enabled: false;
  # without this override the canary model turns on via ai_functions_enabled but its baseline
  # seed stays off, so assert_embedding_canary_matches_baseline can never actually run.
  dbt_context_engineering:
    +enabled: "{{ var('ai_functions_enabled', false) }}"

