name: 'jaffle_logistics'
version: '1.0.0'
config-version: 2

profile: 'jaffle-logistics'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# dbt_context_engineering no longer self-creates ai_run_log (its own bootstrap raced
# under concurrent threads). Runs once, serially, before any model, so there's nothing
# else to race against yet. depends_on is required: ref() inside the macro's
# conditional isn't statically inferable by dbt's parser without it.
on-run-start:
  - "-- depends_on: {{ ref('ai_run_log') }}\n{{ dbt_context_engineering.create_ai_run_log_table() }}"

models:
  jaffle_logistics:
    staging:
      +materialized: view
      +docs:
        node_color: "#D2955C"
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    context:
      # Up-to-meta phase (chunk/reshape through the *_meta models): blue.
      # Overridden to cyan below for the ai/ subfolder (up-to-knowledge-base),
      # and per-model for the five *_hashed models, which sit between the two.
      +docs:
        node_color: "#7C93B0"
      ai:
        # Real cloud AI-function-cost layer (embed()/classify() calls): five
        # independent per-source chains (legal_docs/incident_reports/crm_notes/
        # call_transcripts/support_tickets)_{classify,embed,embedded_classified},
        # plus knowledge_base and search. Their upstream *_hashed helpers stay
        # outside this gate (models/context/) since they only compute a hash
        # column, no AI call.
        # Disabled by default so a plain `dbt build` can never accidentally
        # trigger AI-function spend.
        # This is an actual selection-time gate (dbt won't build a disabled model
        # even under an explicit --select), not just a documentation convention.
        # Opt in per invocation: --vars '{ai_layer_enabled: true}'.
        # Note: even with this on, the package's own dispatch-layer check
        # (ai_functions_enabled, below) still has to be true or the AI call itself
        # raises. Both trace back to the one ai_layer_enabled switch.
        +enabled: "{{ var('ai_layer_enabled', false) }}"
        # Up-to-knowledge-base phase: cyan. knowledge_base itself overrides to
        # purple, search overrides to unset, both in models/context/ai/_context_ai.yml.
        +docs:
          node_color: "#7FAFAF"

  # Same gate, same var, applied to the package's own runtime drift monitor
  # (embedding_canary), which also makes real embed() calls and is disabled by
  # the package's own default for the same reason. Unified under one flag so
  # turning on real AI-function spend is a single decision, not two separate
  # ones to remember.
  dbt_context_engineering:
    monitoring:
      +enabled: "{{ var('ai_layer_enabled', false) }}"

seeds:
  jaffle_logistics:
    +quote_columns: false
    # Source phase (the project's raw origin data): green.
    +docs:
      node_color: "#7FA37F"
    contracts:
      # BigQuery's schema autodetection infers this column as INT64 from the sample
      # values, then rejects the literal "97.0" text in the CSV. Force it explicitly
      # (portable: harmless on Snowflake/DuckDB/Databricks, which infer it correctly).
      +column_types:
        sla_ontime_pct: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"

vars:
  # Master switch for real cloud AI-function spend (embed() calls) across the
  # whole project: our own models/context/ai/ layer and
  # dbt_context_engineering's embedding_canary monitor. false = both disabled,
  # so a plain `dbt build` never calls a billed AI function. Running the rest
  # of the project on Snowflake/BigQuery/Databricks still costs ordinary cloud
  # compute either way, just never AI-function billing; only local DuckDB runs
  # are truly free. Override per invocation, not by editing this file:
  # --vars '{ai_layer_enabled: true}'.
  ai_layer_enabled: false

  # dbt_context_engineering's own dispatch-layer gate (ADR-0030): every AI function
  # raises unless this is true for the target, independent of whether the calling
  # model is even +enabled. Kept tied to the one ai_layer_enabled switch above rather
  # than a second knob to remember to flip.
  ai_functions_enabled: "{{ var('ai_layer_enabled', false) }}"

  # Required on every AI-calling incremental model's own full_refresh config
  # (ADR-0030's require_full_refresh_gate): makes a full re-embed require an explicit
  # opt-in at invocation time, rather than a bare --full-refresh silently re-billing
  # the whole corpus. --vars '{allow_full_reembed: true}'.
  allow_full_reembed: false

  # Per-warehouse model endpoints (region/workspace-dependent; adjust if unavailable).
  # Required by dbt_context_engineering for compile-time embedding fingerprinting
  # (see models/monitoring/embedding_canary.sql) even on targets/models that never
  # actually call generate()/embed() this cut, since dbt Jinja-renders every model
  # file during parsing regardless of --select or a model's own +enabled config.
  model_generate: "{{ 'mistral-large2' if target.type == 'snowflake' else 'databricks-claude-haiku-4-5' if target.type == 'databricks' else 'gemini-2.5-flash' }}"
  embedding_model: "{{ 'snowflake-arctic-embed-m-v1.5' if target.type == 'snowflake' else 'databricks-gte-large-en' if target.type == 'databricks' else 'text-embedding-005' }}"

  # --- Chunking (deterministic, zero AI-function cost) ---------------------
  # 100, not the more typical 512, is deliberate: this seed corpus's transcripts and
  # documents mostly run 80-225 tokens whole, so 512 would never actually split
  # anything. Set small on purpose so a real `dbt build` produces real multi-chunk
  # documents (chunk_id suffixes ::1, ::2, ::3...) to demonstrate and document,
  # not just a single chunk per source artifact every time.
  chunk_target_tokens: 100
  chunk_overlap_tokens: 0

  # --- Output-side cost control ---------------------------------------------
  # Output cap on generate (AI_COMPLETE/ai_query max_tokens). No thinking knob on Cortex/Databricks.
  max_output_tokens: 1024
  # BigQuery AI.* thinking budget, cuts Gemini 2.5 Flash's default thinking output for
  # these structured tasks. Ignored (var default none) on Snowflake/Databricks.
  bq_thinking_budget: 0
  # bq_connection: left unset on BigQuery, try the service-account / default path first.

  # --- Cost guard ceilings --------------------------------------------------
  # Left at the package's own defaults (max_batch_rows: 10000, max_est_tokens:
  # 5000000) intentionally. Do NOT raise these until an embed()-spending build
  # of one of models/context/ai/*_embed.sql has been explicitly approved,
  # that's the whole point of the circuit breaker.
  cost_per_1k_tokens: null

  # Snowflake-only: VECTOR's dimension is part of its type, so this must be a literal
  # matching embedding_model's output dimension (768 for snowflake-arctic-embed-m-v1.5).
  embedding_canary_vector_dimension: 768
