name: 'jaffle_logistics'
version: '1.0.0'
config-version: 2

profile: 'jaffle-logistics'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  jaffle_logistics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  jaffle_logistics:
    +quote_columns: false

vars:
  # Required by dbt_context_engineering for compile-time embedding fingerprinting
  # (see models/monitoring/embedding_canary.sql), even though that model stays
  # excluded from builds via its own `monitoring: +enabled: false` default.
  # Example is Snowflake default
  embedding_model: 'snowflake-arctic-embed-m-v1.5'
  # Snowflake-only: VECTOR's dimension is part of its type, so this must be a literal
  # matching embedding_model's output dimension (768 for snowflake-arctic-embed-m-v1.5).
  embedding_canary_vector_dimension: 768
