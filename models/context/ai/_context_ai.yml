version: 2

# ===========================================================================
# Embedding + retrieval layer: real cloud AI-function cost (embed()/classify()
# calls), distinct from the deterministic layer's zero-AI-function-cost,
# ordinary-cloud-compute-cost SQL. These models stay disabled by default
# (ai_functions_enabled var in dbt_project.yml); build them only after AI-function
# spend is explicitly approved.
#
# Five sources, five independent hash -> classify -> embed -> embedded_classified
# chains (legal_docs, incident_reports, crm_notes, call_transcripts,
# support_tickets), unioned only at knowledge_base. Each source keeps its own
# end-to-end path instead of a shared corpus, reflecting that in a real
# system these would arrive via different systems on different schedules.
# ===========================================================================

models:
  # --------------------------------------------------------- embeddings
  - name: legal_docs_embed
    description: >
      Governed incremental embeddings of legal-doc chunks (embed()), with the
      six-column cache metadata (dbt_context_engineering ADR-0023). One embedding model (var embedding_model)
      across the whole KB. The relationships test below is ADR-0023's
      orphan_chunks/orphan_embeddings pattern: it fails loudly if a chunk_id in this
      table stops existing in legal_docs_hashed after a re-chunk, instead of leaving
      a silent, permanent gap.
    columns:
      - name: chunk_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('legal_docs_hashed')
                field: chunk_id

  - name: incident_reports_embed
    description: "Governed incremental embeddings of incident-report chunks (embed()). Same pattern as legal_docs_embed."
    columns:
      - name: chunk_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('incident_reports_hashed')
                field: chunk_id

  - name: crm_notes_embed
    description: "Governed incremental embeddings of CRM-note chunks (embed()). Same pattern as legal_docs_embed."
    columns:
      - name: chunk_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('crm_notes_hashed')
                field: chunk_id

  - name: call_transcripts_embed
    description: "Governed incremental embeddings of call-transcript chunks (embed()). Same pattern as legal_docs_embed."
    columns:
      - name: chunk_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('call_transcripts_hashed')
                field: chunk_id

  - name: support_tickets_embed
    description: >
      Governed incremental embeddings of whole support-ticket records (embed()); the
      one source that never calls chunk(), reshaping each ticket body straight to the
      chunk-shaped output instead. Same governed pattern as legal_docs_embed otherwise.
    columns:
      - name: chunk_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('support_tickets_hashed')
                field: chunk_id

  # ------------------------------------------------ knowledge base + search
  - name: knowledge_base
    description: >
      Account-scoped KB in the package common shape (source_type, source_id,
      account_key, text, embedding, ts, citation_url) unioning all five
      independently-embedded sources. source_type is a real per-source label
      (Legal Document / Incident Report / CRM Notes / Call Transcript / Support
      Ticket); the finer-grained artifact id is preserved in citation_url and
      source_id.
    config:
      docs:
        node_color: "#9E85AC"
    columns:
      - name: source_id
        tests: [not_null]
      - name: source_type
        tests:
          - accepted_values:
              arguments:
                values: ['Legal Document', 'Incident Report', 'CRM Notes', 'Call Transcript', 'Support Ticket']

  - name: search
    description: "Retrieval demos: Jaffle Equipment account-scoped story + Chicago-storm thematic vector search (each embeds its query once)."
    config:
      docs:
        node_color: null
